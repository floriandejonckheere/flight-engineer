name: FlightEngineer

options:
  bundleIdPrefix: be.floriandejonckheere
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FlightEngineerKit:
    path: Packages/FlightEngineerKit

targets:
  FlightEngineer:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: FlightEngineerKit
      - target: FlightEngineerWidget
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flight Engineer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Florian Dejonckheere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.floriandejonckheere.FlightEngineer
        PRODUCT_NAME: Flight Engineer

  FlightEngineerWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
    dependencies:
      - package: FlightEngineerKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Flight Engineer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/FlightEngineerWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/FlightEngineer/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.floriandejonckheere.FlightEngineer.Widget
        PRODUCT_NAME: FlightEngineerWidget
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

schemes:
  FlightEngineer:
    build:
      targets:
        FlightEngineer: all
        FlightEngineerWidget: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
